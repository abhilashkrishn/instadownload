<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Instagram Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 460px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .logout-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      color: #8a8d91;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .logout-btn:hover {
      background: #f0f2f5;
      color: #dc2743;
    }
    h2 {
      margin-top: 10px;
      margin-bottom: 8px;
      color: #1c1e21;
      font-size: 24px;
    }
    p {
      color: #65676b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1.5px solid #e4e6eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0095f6;
    }
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { opacity: 0.95; }
    button[type="submit"]:active { transform: scale(0.99); }

    .alert {
      background: #ffebe8;
      border: 1px solid #dd3c10;
      color: #dd3c10;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }

    #loadingState {
      display: none;
      margin-top: 24px;
      animation: fadeIn 0.3s ease-in-out;
    }
    .spinner {
      width: 46px;
      height: 46px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, transparent);
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #fff 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #fff 0);
      animation: spin 0.9s linear infinite;
    }
    .status-text {
      color: #1c1e21;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Size Counter & Progress Bar */
    #progressContainer {
      display: none;
      margin-top: 20px;
      animation: fadeIn 0.3s ease-in-out;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #4b4f56;
      margin-bottom: 8px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e4e6eb;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366);
      border-radius: 20px;
      transition: width 0.05s linear;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="logout" class="logout-btn">Log Out</a>

    <h2>Insta Media Saver</h2>
    <p>Paste a Post or Reel URL to fetch your media cleanly.</p>

    <div id="errorAlert" class="alert"></div>

    <form id="downloadForm">
      <input type="text" id="urlInput" placeholder="https://www.instagram.com/reels/..." required autocomplete="off">
      <button type="submit" id="submitBtn">Download</button>
    </form>

    <!-- State 1: Connecting & Extracting -->
    <div id="loadingState">
      <div class="spinner"></div>
      <div class="status-text" id="statusMessage">Connecting to Instagram...</div>
    </div>

    <!-- State 2: Size Fill Counter & Bar -->
    <div id="progressContainer">
      <div class="progress-meta">
        <span id="progressLabel">Preparing file...</span>
        <span id="sizeCounter">0.00 MB / 0.00 MB</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("downloadForm");
    const submitBtn = document.getElementById("submitBtn");
    const loadingState = document.getElementById("loadingState");
    const statusMessage = document.getElementById("statusMessage");
    const errorAlert = document.getElementById("errorAlert");
    const urlInput = document.getElementById("urlInput");

    const progressContainer = document.getElementById("progressContainer");
    const progressFill = document.getElementById("progressFill");
    const sizeCounter = document.getElementById("sizeCounter");
    const progressLabel = document.getElementById("progressLabel");

    const messages = [
      "Connecting to Instagram...",
      "Extracting highest quality stream...",
      "Processing media container..."
    ];

    let messageInterval;

    function animateFill(targetMb, onComplete) {
      loadingState.style.display = "none";
      progressContainer.style.display = "block";
      progressLabel.innerText = "Packing media...";

      const durationMs = 1200; // total animation time in ms
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        
        // Quadratic ease-out for realistic filling physics
        const ease = 1 - Math.pow(1 - progress, 2);
        const currentMb = (targetMb * ease).toFixed(2);
        const percent = (ease * 100).toFixed(1);

        progressFill.style.width = percent + "%";
        sizeCounter.innerText = `${currentMb} MB / ${targetMb.toFixed(2)} MB`;

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          progressLabel.innerText = "Starting download...";
          setTimeout(onComplete, 300);
        }
      }
      requestAnimationFrame(update);
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      errorAlert.style.display = "none";
      progressContainer.style.display = "none";
      progressFill.style.width = "0%";

      const url = urlInput.value.trim();
      if (!url) return;

      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";
      submitBtn.innerText = "Processing...";
      loadingState.style.display = "block";
      statusMessage.innerText = messages[0];

      let msgIndex = 0;
      messageInterval = setInterval(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        statusMessage.innerText = messages[msgIndex];
      }, 2400);

      try {
        const res = await fetch("api/process", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });

        if (res.status === 401) {
          window.location.href = "login";
          return;
        }

        const data = await res.json();
        clearInterval(messageInterval);

        if (!data.success) {
          throw new Error(data.error || "Failed to process media.");
        }

        // Trigger the filling animation from 0 to total file size
        const targetMb = data.file_size_mb || 0;
        animateFill(targetMb, () => {
          submitBtn.disabled = false;
          submitBtn.style.opacity = "1";
          submitBtn.innerText = "Download";
          urlInput.value = "";
          
          window.location.href = data.download_url;
        });

      } catch (err) {
        clearInterval(messageInterval);
        loadingState.style.display = "none";
        progressContainer.style.display = "none";
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        submitBtn.innerText = "Download";
        errorAlert.innerText = err.message;
        errorAlert.style.display = "block";
      }
    });
  </script>
</body>
</html>
