<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Insta Downloader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #1c1e21;
      font-size: 24px;
    }
    p {
      color: #65676b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 14px;
      border: 1.5px solid #e4e6eb;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #0095f6;
    }
    button {
      width: 100%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover {
      opacity: 0.95;
    }
    .error {
      background: #ffebe8;
      border: 1px solid #dd3c10;
      color: #dd3c10;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>
    <p>Enter your credentials to continue</p>

    <div id="errMsg" class="error"></div>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required autofocus autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const errMsg = document.getElementById("errMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerText = "Signing in...";

      try {
        const res = await fetch("api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = "./";
        } else {
          errMsg.innerText = data.error || "Invalid username or password.";
          errMsg.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.innerText = "Sign In";
        }
      } catch (err) {
        errMsg.innerText = "Connection error. Please try again.";
        errMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerText = "Sign In";
      }
    });
  </script>
</body>
</html>
